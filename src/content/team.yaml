# =============================================================================
# TEAM — edit this file to add / remove / reorder lab members.
# Save and the dev server (npm run dev) reloads automatically.
#
# Each entry needs a unique `id` (used as the profile URL: /team/<id>).
# Required: id, name, role, avatar. Everything else is optional.
#
#   role:        one of Principal Investigator | Professor | Associate Professor |
#                Assistant Professor | Postdoc | Research Assistant | PhD Student |
#                Master Student | Undergraduate | Alumni
#   title:       list of badge labels shown on the card, e.g. [Postdoc]
#   avatar:      put the image in public/assets/people/ and point to it here
#   weight:      sort order within a role group (lower = listed first)
#   author_keys: exact author strings from publications, so this person's papers
#                attach to their profile. List every name variant that appears.
#   Optional links: website, linkedin, github, twitter, googleScholar, email, bio
#
#   ALUMNI (role: Alumni) are different: they render as a plain text list at the
#   bottom of the Team page — no photo, no profile page, no links. Omit `avatar`
#   and use `employment` for their current position. Example:
#
#     - id: alum-jane-doe
#       name: Jane Doe
#       role: Alumni
#       employment: Data Scientist, Google
#       weight: 60
# =============================================================================

